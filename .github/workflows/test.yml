name: Test
on: [push, pull_request]
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dc: [dmd-2.114.0, ldc-1.43.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}
      - run: dub test
      - name: Build and test the Mir draws example
        if: runner.os == 'Linux' && startsWith(matrix.dc, 'ldc-')
        run: |
          dub build --root=examples/mir-draws
          dub test --root=examples/mir-draws
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && matrix.dc == 'ldc-1.43.0'
      - name: Verify Windows model runtime ownership and sampling ABI
        if: runner.os == 'Windows' && matrix.dc == 'ldc-1.43.0'
        shell: cmd
        run: |
          set "src=%CD%"
          cd /d "%RUNNER_TEMP%"
          mkdir decoy
          cl /std:c11 /nologo /LD /I"%src%\source\dstan\internal" /DPATCH=2 "%src%\tests\abi\fixture.c" /Fewrong.dll || exit /b 1
          cl /std:c11 /nologo /LD /I"%src%\source\dstan\internal" /DPATCH=3 "%src%\tests\abi\fixture.c" /Femissing.dll || exit /b 1
          cl /std:c11 /nologo /LD "%src%\tests\abi\runtime.c" /Fetbb.dll || exit /b 1
          copy tbb.dll decoy\tbb.dll || exit /b 1
          cl /std:c11 /nologo /LD /I"%src%\source\dstan\internal" "%src%\tests\abi\sampling.c" tbb.lib /Fesampling.dll || exit /b 1
          cd /d "%src%"
          dub run --root=tests/abi -- "%RUNNER_TEMP%\wrong.dll" "%RUNNER_TEMP%\missing.dll" "%RUNNER_TEMP%\sampling.dll" "%RUNNER_TEMP%\tbb.dll" "%RUNNER_TEMP%\decoy\tbb.dll"
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Install pinned upstream
        run: |
          curl -fsSL --retry 3 https://github.com/WardBrian/tinystan/releases/download/v0.3.3/tinystan-0.3.3.tar.gz | tar -xz -C "$RUNNER_TEMP"
          root="$RUNNER_TEMP/tinystan-0.3.3"
          echo "TINYSTAN=$root" >> "$GITHUB_ENV"
          cmp source/dstan/internal/tinystan.h "$root/src/tinystan.h"
          cmp source/dstan/internal/tinystan_types.h "$root/src/tinystan_types.h"
          mkdir -p "$root/make"
          echo 'O=1' > "$root/make/local"
      - name: Verify loader failures and ABI
        run: |
          cc -fPIC -shared -DPATCH=2 -Isource/dstan/internal tests/abi/fixture.c -o "$RUNNER_TEMP/wrong.so"
          cc -fPIC -shared -DPATCH=3 -Isource/dstan/internal tests/abi/fixture.c -o "$RUNNER_TEMP/missing.so"
          cc -fPIC -shared -Isource/dstan/internal tests/abi/sampling.c -o "$RUNNER_TEMP/sampling.so"
          dub run --root=tests/abi -- "$RUNNER_TEMP/wrong.so" "$RUNNER_TEMP/missing.so" "$RUNNER_TEMP/sampling.so"
      - name: Sample and compare with Python
        run: |
          set -o pipefail
          export DSTAN_REFERENCE_DRAWS="$RUNNER_TEMP/chain-draws"
          dub run --root=tests/integration -- "$PWD/tests/models" | tee "$RUNNER_TEMP/summary"
          python3 -m venv "$RUNNER_TEMP/reference"
          "$RUNNER_TEMP/reference/bin/pip" install tinystan==0.3.3
          for mode in serial parallel; do
            "$RUNNER_TEMP/reference/bin/python" tests/integration/reference.py tests/models/normal_model.so "$RUNNER_TEMP/summary" "$DSTAN_REFERENCE_DRAWS" "$mode"
          done
      - name: Verify SIGINT and same-model recovery
        run: python3 tests/interrupt/run.py tests/integration/dstan-integration
